# 捷联式导引头 A2416A 仿真参数。长度单位为 m，角度单位为 deg。
[model]
# 缺少整机尺寸资料时采用的圆柱占位外形。
name = jielian_a2416a
diameter_m = 0.060
height_m = 0.060
mass_kg = 0.050

[optics]
# 单可见光模块标称输出与视场。
width_px = 1920
height_px = 1080
fps = 25
hfov_deg = 37
vfov_deg = 21
fx_px = 2869.1375642331777
fy_px = 2913.579274132334
cx_px = 960
cy_px = 540
near_clip_m = 0.005
far_clip_m = 30000

[tracking]
# 仅登记的飞机实体参与真值检测，名称逗号分隔。
target_names = target_aircraft,target_aircraft_2,target_aircraft_3,target_aircraft_4
measurement_hz = 50
auto_detection_range_m = 780
manual_tracking_range_m = 1200
lost_timeout_s = 2.5
max_targets = 4
misalignment_limit_deg = 20
crosshair_max_speed_px_s = 400
crosshair_timeout_s = 0.5
gate_scale_min = 0.5
gate_scale_max = 4.0

[protocol]
# 话题承载内部 JSON；厂商二进制协议由独立网关转换。
command_topic = /jielian_a2416a/command
telemetry_topic = /jielian_a2416a/telemetry
command_result_topic = /jielian_a2416a/command_result

[network]
udp_bind = 127.0.0.1
udp_port = 8001
peer_timeout_s = 2.0
telemetry_hz = 100

[video]
rtsp_bind = 127.0.0.1
rtsp_port = 8554
rtsp_mount = /jielian_a2416a
codec = H264
bitrate_kbps = 2000

[viewer]
near_clip_m = 0.005
sensitivity = 0.1

[demo]
world_name = jielian_a2416a_preview
marker_name = JIELIAN_A2416A_LOCATION_MARKER
