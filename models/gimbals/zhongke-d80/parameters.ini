# 中科D80性能和运行参数。修改后重启组件；角度为度，长度单位见各项说明。
# 标称资料不等于已建模的电气或随机误差；外形保持复制模型，不按产品尺寸缩放。
[model]
# 实际总质量kg，正有限数；按CAD体积分配质量并同步缩放惯性，默认0.195。
mass_kg = 0.195
# 中科专属模型名，无单位，非空英文标识符，默认zhongke_d80；用于实体和诊断身份。
name = zhongke_d80
# 本机诊断的飞机ID，无单位，非负整数，默认1；不属于厂商二进制帧，不自动改变RTSP路径。
aircraft_id = 1

[mechanics]
# 方位硬限位下界°，默认-90；有限、有序、包含0且可用S16×0.01表示，驱动物理限位。
yaw_min_deg = -90
# 方位硬限位上界°，默认90；同一下界约束，驱动物理限位。
yaw_max_deg = 90
# 俯仰硬限位，度；同样包含0，负值向下，默认-90～30。
pitch_min_deg = -90
# 俯仰硬限位上界°，默认30；有限、有序、包含0且可用S16×0.01表示，驱动物理限位。
pitch_max_deg = 30
# 每轴最大实际转速°/s，(0,327.67]；人工/回零/跟踪共用，默认20。
max_rate_dps = 20
# 最大加速度°/s²，正有限数；保持复制控制器160的平滑约束。
max_acc_dps2 = 160
# 回零比例增益s^-1，正有限数，默认4；输出仍受速度/加速度/端点约束。
kp = 4
# 软件停车缓冲°，非负且小于可用行程；默认0.2，软区保留机械零位且不改变硬限位。
stop_margin_deg = 0.2

[optics]
# 实际原图宽高px，正偶数，默认1920×1080；成像、坐标和编码器共用。
width_px = 1920
# 实际原图高度px，正偶数，默认1080；成像、坐标和编码器共用。
height_px = 1080
# 相机实际帧率Hz，正有限数，默认30。
fps = 30
# 当前焦距mm，正有限数，默认50；在固定感光面下联动改变实际视场。
focal_length_mm = 50
# 标定焦距mm，正有限数，默认50；与下列两个标定角确定等效感光面。
reference_focal_length_mm = 50
# 标定水平视场角°，(0,180)，默认7.03；不是独立运行视场覆盖值。
reference_hfov_deg = 7.03
# 标定垂直视场角°，(0,180)，默认3.95；fy独立计算，不强制等于fx。
reference_vfov_deg = 3.95
# 视频相机近裁剪m，0<near<far，默认0.005；控制渲染及真值投影的近端可见性。
near_clip_m = 0.005
# 视频相机远裁剪m，必须大于near，默认30000；控制渲染及真值投影可见性，独立于发现距离。
far_clip_m = 30000

[tracking]
# 真值目标精确名称列表，逗号分隔、去空格、不重复；不存在实体不成为候选。
target_names = target_a,target_b,target_c
# 最远发现距离m，正有限数，默认300；仅用于初选/重选，已锁超距继续跟踪。
discovery_range_m = 300
# 点选回退提示半径px，非负，默认80；超过仍选画面内离点击最近者并提示。
point_fallback_radius_px = 80
# 自动等待/失效时的重选周期s，正有限数，默认0.2。
reacquire_period_s = 0.2
# 短暂失踪至最终丢失计时s，正有限数，默认2.5；不延迟停止旧跟踪输出。
lost_timeout_s = 2.5

[product]
# 产品标称质量上限g，正数，默认195；资料项，实际质量由model.mass_kg决定。
mass_limit_g = 195
# 标称DC供电V，正数，默认12；资料项，无电气仿真。
supply_voltage_v = 12
# 标称平均功耗上限W，非负且平均<=峰值，默认7；资料项，不耦合运动/成像。
average_power_limit_w = 7
# 标称峰值功耗上限W，非负且不小于平均值，默认12.7；资料项，不耦合运动/成像。
peak_power_limit_w = 12.7
# 标称直径上限mm，正数，默认49；资料项，不缩放约Ø84×91mm复制外形。
diameter_limit_mm = 49
# 标称高度上限mm，正数，默认80；资料项，不缩放复制外形。
height_limit_mm = 80
# 指定角度范围内的标称指向精度°，非负，默认0.2；不加入随机误差。
pointing_accuracy_deg = 0.2
# 指向精度适用方位范围°，资料项，有限有序，默认-30～30。
accuracy_yaw_min_deg = -30
# 指向精度适用方位上界°，默认30；有限且不小于下界，仅作资料展示。
accuracy_yaw_max_deg = 30
# 指向精度适用俯仰范围°，资料项，有限有序，默认-30～30。
accuracy_pitch_min_deg = -30
# 指向精度适用俯仰上界°，默认30；有限且不小于下界，仅作资料展示。
accuracy_pitch_max_deg = 30
# 标称视场角容差%，非负，默认5；不作为随机视场抖动。
fov_tolerance_percent = 5

[network]
# 中科独立UDP监听IP，无单位，IP字面量，默认127.0.0.1；收16字节控制、回32字节遥测。
udp_bind = 127.0.0.1
# 中科UDP端口，无单位，1～65535，默认8870；收16字节控制、回32字节遥测。
udp_port = 8870
# 新物理测量的目标遥测Hz，正有限数，默认60；暂停/断源不重播。
telemetry_hz = 60
# 单客户端对端租约s，正有限数，默认2；只有合法支持帧续租。
peer_lease_s = 2
# 非零MANUAL速度超时s，正有限数，默认0.5；00不刷新，切换模式撤销旧计时。
manual_timeout_s = 0.5
# 遥测/发送队列的新鲜性上限s，正有限数，默认1。
telemetry_max_age_s = 1

[video]
# 中科独立RTSP监听IP/端口，默认127.0.0.1:8556；占用时报错，不接管旧服务。
rtsp_bind = 127.0.0.1
# 中科RTSP端口，无单位，1～65535，默认8556；占用时报错，不接管旧服务。
rtsp_port = 8556
# 单路RTSP挂载路径，默认/zhongke_d80_1；不得与原组件共享路径。
rtsp_mount = /zhongke_d80_1
# 视频编码码率kb/s，正整数，默认8000；实际编码使用NVENC。
bitrate_kbps = 8000

[viewer]
# 浏览相机近裁剪m，正数，默认0.005；独立于吊舱视频相机。
near_clip_m = 0.005
# Gazebo浏览鼠标灵敏度，正数，默认0.1；作用于缩放/平移/旋转。
sensitivity = 0.1

[demo]
# 中科独立演示世界名，无单位，非空英文标识符，默认zhongke_d80_demo；用于话题归属。
world_name = zhongke_d80_demo
# 鲜明无碰撞定位标志名，无单位，非空英文标识符，默认ZHONGKE_D80_LOCATION_MARKER；便于搜索定位。
marker_name = ZHONGKE_D80_LOCATION_MARKER
