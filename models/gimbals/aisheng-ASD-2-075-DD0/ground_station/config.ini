[network]
# 网关地址和二进制 UDP 端口
host = 127.0.0.1
control_port = 8790
telemetry_port = 8791
# 网关 19 字段 JSON 遥测端口（供“发送艾晟报文”使用）
json_telemetry_port = 8792

[video]
# 广角/长焦共用的固定 RTSP URL，网关按镜头选择自动切换内容
rtsp_url = rtsp://127.0.0.1:8554/aisheng_seeker

[session]
# 启动时激活的镜头：wide 或 tele
lens = wide
# true 时不发送启动镜头切换命令，适合接管已建立的跟踪
no_lens_switch = false
