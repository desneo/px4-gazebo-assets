# 中科D80火箭装配配置；基础组件性能由component.parameters_file读取。
# 已确认顶部底环水平，安装旋转为零；零位光轴沿机体+Z，前视使用负俯仰。
# overall_length_m保留原生590mm总长，顶部仅裁切视觉与碰撞，不扣除原机质量/惯性。
# --config可指定场景完整中科INI；不修改基础parameters.ini。
# dynamic配置独立模型的PX4编号与Gazebo话题，场景可用CLI覆盖。
# view仅控制浏览相机；相机成像参数继承中科INI。
# px4继承同安装两轴组合的角速度调节参数；飞行结果必须另行实测。
# stability_validation为验收阈值，不构成已经通过的飞行结论。
# 装配几何单位m；yaw_deg/pitch_deg仅指定静态预览角度，不改变动态关节零位。
[assembly]
# 总长，须等于原火箭模型真实包络，默认0.59m。
overall_length_m = 0.59
# 机身接到底环的过渡肩长度，默认0.012m。
shoulder_length_m = 0.012
yaw_deg = 0.0
pitch_deg = 0.0

# 性能配置路径相对本装配目录；完整中科INI可用动态CLI --config覆盖。
[component]
parameters_file = ../../models/gimbals/zhongke-d80/parameters.ini

# 新组合独立airframe及Gazebo前缀；场景可用同名CLI覆盖。
[dynamic]
airframe_id = 4025
topic_prefix = /rocket_zhongke_d80

# 浏览相机，非云台成像相机；clip单位m、camera_pose为xyz/RPY(rad)。
[view]
# GUI view_control服务建议值，同时影响缩放、平移与旋转。
mouse_sensitivity = 0.1
near_clip_m = 0.005
far_clip_m = 100.0
camera_pose = 0.75, -0.9, 0.67, 0.0, 0.29, 2.2655
close_camera_pose = 0.23, -0.28, 0.68, 0.0, 0.3, 2.258

# 与同安装两轴火箭组合一致的滚转/俯仰角速度控制参数；派生CG/hover参数禁止覆盖。
[px4]
mc_rollrate_p = 0.08
mc_rollrate_i = 0.08
mc_rollrate_d = 0.0005
mc_rr_int_lim = 0.1
mc_pitchrate_p = 0.08
mc_pitchrate_i = 0.08
mc_pitchrate_d = 0.0005
mc_pr_int_lim = 0.1

# 实际飞行验收阈值：时间s，角度deg，角速度deg/s，LOS像素，频段Hz；结果须另行实测。
[stability_validation]
hover_settle_s = 5.0
spectral_band_hz = 5.0, 35.0
spectral_window_s = 4.0
attitude_trend_window_s = 0.5
rate_error_rms_limit_dps = 2.0
rate_error_p95_limit_dps = 4.0
rate_error_max_limit_dps = 10.0
rate_hf_rms_limit_dps = 0.5
attitude_p95_limit_deg = 0.1
attitude_peak_to_peak_limit_deg = 0.5
allocator_unachieved_ratio_limit = 0.01
allocator_unachieved_continuous_limit_s = 0.1
unallocated_torque_p99_limit = 0.002
motor_floor_threshold = 0.001
motor_floor_ratio_limit = 0.01
camera_los_required = true
camera_los_p95_limit_px = 6.0
camera_los_max_limit_px = 15.0
