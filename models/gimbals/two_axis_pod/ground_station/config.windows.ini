# Windows 两轴吊舱 Station 配置。
# 视频固定要求 OpenCV/FFmpeg D3D11 硬解，不提供软件解码配置项。

[network]
# 吊舱网关所在主机，同时用于 UDP 和 RTSP。
gimbal_host = 192.168.1.56
# 网关 UDP 控制与遥测端口。
udp_port = 8770
# RTSP 服务端口。
rtsp_port = 8555
# 飞机身份；必须与网关一致。
aircraft_id = 1
# RTSP 路径前缀；实际路径为 /two_axis_pod_<aircraft_id>。
rtsp_mount = /two_axis_pod

[video]
# RTSP 传输方式：tcp 或 udp；跨主机默认使用 tcp。
rtsp_transport = tcp
# 窗口显示缩放比例，允许范围 0.05～2.0。
display_scale = 0.5
# Station 窗口标题。
window_title = Two Axis Pod Ground Station - Aircraft 1
# Windows 中文字体文件。
font_path = C:/Windows/Fonts/msyh.ttc

[forward]
# 艾晟 11 字段 UDP JSON 接收地址；仅保存地址，重启默认不发送。
# 点击“发送艾晟报文”后，每份新遥测包转换一次，默认约 50 Hz；不是完整状态副本。
ip = 127.0.0.1
port = 9000

[session]
# 超过该秒数未收到网关消息即判定连接超时。
client_timeout = 5.0
# 可靠指令未收到回执时的重发间隔，单位秒。
retry_interval = 0.2
# 可靠指令最大发送次数，包含首次发送。
retry_max = 5
# 断线后是否持续发送登记消息并等待恢复。
reconnect = true
