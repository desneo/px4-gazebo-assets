[network]
# 导引头网关的控制/遥测共用端口。
host = 127.0.0.1
port = 8001

[forward]
# “发送艾晟报文”面板的默认目的地址；02场景可用命令行逐机覆盖。
# 报文为 aisheng_udp_bridge 要求的顶层37字段 JSON，点击按钮后才发送。
ip = 127.0.0.1
port = 9000

[video]
# 单可见光 H.264 RTSP 流；地面站强制使用 NVIDIA 硬件解码。
rtsp_url = rtsp://127.0.0.1:8554/jielian_a2416a
width = 1920
height = 1080
fps = 25

[display]
# 视频按 1/2 比例显示，鼠标坐标会映射回 1920x1080 原图。
width = 960
height = 540
window_title = A2416A 捷联导引头地面站
