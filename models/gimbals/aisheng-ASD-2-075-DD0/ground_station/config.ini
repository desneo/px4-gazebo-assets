[network]
# 网关地址；控制帧从地面站发送到该主机的 control_port
host = 127.0.0.1
# 网关须监听相同控制端口；命令行 --control-port 可覆盖此值
control_port = 8001
# 控制与遥测共用本机自动分配的 UDP 临时端口，网关回传到控制/心跳发送方

[forward]
# “发送艾晟报文”面板的默认目的 IP，按发送按钮后才转发
host = 127.0.0.1
# 专用 aisheng_udp_bridge 的接收端口；多机由场景分别指定
port = 9000

[video]
# 广角/长焦共用的固定 RTSP URL，网关按镜头选择自动切换内容
rtsp_url = rtsp://127.0.0.1:8554/aisheng_seeker

[session]
# 启动时激活的镜头：wide 或 tele
lens = wide
# true 时不发送启动镜头切换命令，适合接管已建立的跟踪
no_lens_switch = false
