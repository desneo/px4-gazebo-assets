# 火箭穿越机与 A2416A 捷联导引头装配配置。
# 顶部 60 mm 机身外形由导引头替换，总长保持 590 mm。
# 机身原有质量和惯量不扣除被裁切外形，再叠加 0.05 kg 导引头占位质量。

[assembly]
overall_length_m = 0.590
mount_z_m = 0.320
shoulder_start_z_m = 0.308
seeker_height_m = 0.060
seeker_diameter_m = 0.060

[component]
model_dir = ../../models/gimbals/jielian-A2416A
link_name = seeker_link
sensor_name = camera

[dynamic]
airframe_id = 4026
topic_prefix = /rocket_jielian_a2416a

[view]
# GUI view_control 服务建议值，同时影响缩放、平移与旋转。
mouse_sensitivity = 0.1
near_clip_m = 0.005
far_clip_m = 100.0
camera_pose = 0.75, -0.90, 0.67, 0.0, 0.29, 2.2655
close_camera_pose = 0.23, -0.28, 0.68, 0.0, 0.30, 2.258

[px4]
mc_rollrate_p = 0.08
mc_rollrate_i = 0.08
mc_rollrate_d = 0.0005
mc_rr_int_lim = 0.1
mc_pitchrate_p = 0.08
mc_pitchrate_i = 0.08
mc_pitchrate_d = 0.0005
mc_pr_int_lim = 0.1

[flight_validation]
hover_duration_s = 30.0
cruise_speed_kmh = 200.0
cruise_duration_s = 30.0
sprint_speed_kmh = 300.0
sprint_duration_s = 10.0
require_landing_and_disarm = true
require_tracking_and_telemetry = true
