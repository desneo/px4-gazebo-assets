# 中科 D80 地面站偏好，修改后重启生效；性能参数来自组件 parameters.ini。
[connection]
# 远端云台UDP地址，IP字面量，默认127.0.0.1；独立模式不读取演示世界清单。
udp_host = 127.0.0.1
# 远端控制/遥测服务端口，整数1～65535，默认8870；同一socket发送控制并接收遥测。
udp_port = 8870
# 本地接收绑定IP，默认0.0.0.0监听本机IPv4接口；须与远端地址IP版本一致。
local_bind = 0.0.0.0
# 本地接收端口，整数0～65535，默认0由系统分配；可填写固定端口，实际值启动时显示。
local_port = 0
# 视频连接地址，合法rtsp://URL，默认本机8556中科单路视频；独立模式按本项连接。
rtsp_url = rtsp://127.0.0.1:8556/zhongke_d80_1
# 物理/光学性能INI路径，默认../parameters.ini；相对本配置文件，不另存一套性能参数。
parameters_file = ../parameters.ini

[video]
# 窗口显示比例，无量纲，有效 0.05～2.0，默认 0.5；不改变原图像素坐标。
display_scale = 0.5
# 视频硬解元件选择，当前仅支持 nvdec；默认 nvdec，无软件回退。
decoder = nvdec
# 窗口标题，非空文字，默认“中科 D80 地面站”。
window_title = 中科 D80 地面站
# 中文字体绝对路径，默认 NotoSansCJK；缺失时显示启动说明中的依赖错误。
font_path = /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

[forward]
# 接收 JSON 的合法 IP，默认 127.0.0.1；仅保存地址，每次启动默认不发送。
ip = 127.0.0.1
# 接收端口，整数 1～65535，默认 9000；不能等于本中科控制端点。
port = 9000
