# Linux 两轴吊舱 Station 配置。
# 修改后重新启动 run.sh 生效；命令行同名参数只用于临时覆盖。

[network]
# 网关主机，同时用于 UDP 控制/遥测和 RTSP 视频。
gimbal_host = 192.168.1.56
# 网关 UDP 控制与遥测端口。
udp_port = 8770
# RTSP 服务端口。
rtsp_port = 8555
# 飞机身份；必须与网关一致，且会追加到 RTSP 路径末尾。
aircraft_id = 1
# RTSP 路径前缀；实际路径为 /two_axis_pod_<aircraft_id>。
rtsp_mount = /two_axis_pod

[bridge]
# run.sh 启动并管理本机对应网关；stop.sh 或关闭 GUI 时停止。
# 连接其他主机时设为 false，并在网关主机执行 run_bridge.sh。
manage = true
# 以下参数用于没有网关运行时启动 1 号机网关，须与 Gazebo 场景一致。
world = geo_32_217857_119_105878
model = rocket_two_axis_pod_1
# 插件控制/遥测话题前缀及相机的完整话题。
topic_prefix = /uav_1/pod
image_topic = /uav_1/pod/image
# Gazebo Transport 分区；留空继承终端 GZ_PARTITION。
gz_partition = px4_scenario_02_rocket_two_axis_pod

[video]
# 窗口显示缩放比例，允许范围 0.05～2.0。
display_scale = 0.5
# Linux 仅允许 nvdec；nvenc 只作为旧名称兼容，仍映射到 nvh264dec。
decoder = nvdec
# Station 窗口标题。
window_title = Gimbal Ground Station
# 中文字体文件；不存在时会按程序内置候选路径查找。
font_path = /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

[forward]
# 艾晟 16 字段 UDP JSON 接收地址；仅保存地址，重启默认不发送。
# 点击“发送艾晟报文”后，每份新遥测转换一次，默认约 50 Hz；不是完整状态副本。
ip = 192.168.1.40
port = 9000

[session]
# 超过该秒数未收到网关消息即判定连接超时。
client_timeout = 5.0
# 可靠指令未收到回执时的重发间隔，单位秒。
retry_interval = 0.2
# 可靠指令最大发送次数，包含首次发送。
retry_max = 5
# 断线后是否持续发送登记消息并等待恢复。
reconnect = true
